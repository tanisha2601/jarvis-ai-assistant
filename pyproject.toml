[project]
name = "jarvis-ai-assistant"
version = "1.0.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.118.0",
    "uvicorn==0.37.0",
    "starlette==0.48.0",
    "python-multipart==0.0.20",
    "pydantic==2.11.9",
    "python-dotenv==1.1.1",
    "google-generativeai",
]

[tool.vercel]
entrypoint = "backend:app"